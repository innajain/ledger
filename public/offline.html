<!doctype html>
<!--
  Shown by public/sw.js when a page can't be reached. It is the only thing the service
  worker caches, so it must stand alone: no scripts (the CSP only allows nonce'd ones),
  no external assets (the logo is inlined), nothing from the ledger. After editing it,
  bump OFFLINE_CACHE in sw.js so installed apps pick up the new copy.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <title>Offline | Ledger</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f7;
        --card: #f7f7f7;
        --border: #e0e0e0;
        --text: #1f1f1f;
        --muted: #6b6b6b;
        --accent: #1d5b45;
        --accent-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171717;
          --card: #171717;
          --border: #2f2f2f;
          --text: #ececec;
          --muted: #969696;
          --accent: #86c7a8;
          --accent-text: #111111;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 32px 24px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 12px 0 4px;
        font-size: 20px;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 15px;
      }
      a {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 10px;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
