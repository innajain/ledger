services:
  postgres:
    image: postgres:17
    container_name: local-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: appdb
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.2.5-bookworm
    container_name: local-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  sync-db:
    image: node:22-bookworm-slim
    environment:
      - PG_SRC=${PROD_DATABASE_URL}
      - PG_DEST=postgresql://postgres@postgres:5432/appdb
      - REDIS_SRC=${PROD_REDIS_URL:-}
      - REDIS_DEST=redis://redis:6379
      - PROD_BLOB_TOKEN=${PROD_BLOB_READ_WRITE_TOKEN:-}
      - DEST_BLOB_TOKEN=${BLOB_READ_WRITE_TOKEN:-vercel_blob_rw_local_dev}
      # Container-internal URL for the blob emulator. The host-facing URL is
      # http://localhost:3100/api/blob; inside the docker network it's
      # http://blob:3000/api/blob.
      - DEST_BLOB_API_URL=http://blob:3000/api/blob
    volumes:
      - ./scripts/sync:/sync:ro
    entrypoint:
      - bash
      - -c
      - |
        set -e
        # Pull postgresql-client-17 from PGDG (Debian Bookworm only ships
        # postgresql-client-15, and pg_dump must be >= server version — Neon
        # is on 17).
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg lsb-release >/dev/null
        curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
        echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list
        apt-get update -qq
        apt-get install -y -qq postgresql-client-17 >/dev/null
        # Copy the script to a writable dir before installing deps. Can't
        # install in /sync (mounted read-only from the host, on purpose so
        # the host's working tree stays clean), and NODE_PATH doesn't apply
        # to ESM resolution — Node walks up from the script's directory
        # looking for node_modules, so the script + node_modules must live
        # in the same writable location.
        mkdir -p /work
        cp /sync/sync.mjs /work/
        cd /work
        # Pin to the same versions as the app to avoid SDK drift surprises.
        npm install --silent --no-save --no-package-lock @vercel/blob@2.3.3 ioredis@5.10.1
        node sync.mjs
    depends_on:
      - postgres
      - redis
      - blob

  blob:
    image: ghcr.io/payloadcms/vercel-blob-emulator:latest
    container_name: local-blob
    ports:
      - '3100:3000'
    environment:
      EMULATOR_BASE_URL: 'http://localhost:3100'
    volumes:
      - blob_data:/data

volumes:
  postgres_data:
  redis_data:
  blob_data:
