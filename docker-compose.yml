services:
  postgres:
    image: postgres:17
    container_name: local-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: appdb
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.2.5-bookworm
    container_name: local-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  sync-db:
    image: python:3.12-slim
    environment:
      - PG_SRC=${PROD_DATABASE_URL}
      - PG_DEST=postgresql://postgres@postgres:5432/appdb
      - REDIS_SRC=${PROD_REDIS_URL:-}
      - REDIS_DEST=redis://redis:6379
    entrypoint:
      - bash
      - -c
      - |
        set -e
        apt-get update -qq && apt-get install -y -qq postgresql-client ca-certificates
        pip install --quiet redis
        python3 - <<'PYEOF'
        import os
        import redis
        dest = redis.from_url(os.environ['REDIS_DEST'])
        dest.flushall()
        print('Flushed local Redis')
        src_url = os.environ.get('REDIS_SRC')
        if src_url:
            src = redis.from_url(src_url)
            n = 0
            for key in src.scan_iter():
                ttl = src.pttl(key)
                if ttl < 0:
                    ttl = 0
                dump = src.dump(key)
                if dump:
                    dest.restore(key, ttl, dump, replace=True)
                    n += 1
            print(f'Synced {n} keys from prod Redis')
        else:
            print('PROD_REDIS_URL not set; skipped Redis copy')
        PYEOF
        echo 'Syncing Postgres from prod...'
        # PGSSLROOTCERT=system tells libpq to verify Neon's cert via the system trust
        # store (needed because channel_binding=require triggers verify-full on libpq 17).
        # Applied only to pg_dump; the local pg_restore connection doesn't use SSL.
        PGSSLROOTCERT=system pg_dump "$$PG_SRC" --format=custom --no-owner --no-privileges | \
          pg_restore -d "$$PG_DEST" --clean --if-exists --no-owner --no-privileges
    depends_on:
      - postgres
      - redis

  blob:
    image: ghcr.io/payloadcms/vercel-blob-emulator:latest
    container_name: local-blob
    ports:
      - '3100:3000'
    environment:
      EMULATOR_BASE_URL: 'http://localhost:3100'
    volumes:
      - blob_data:/data

volumes:
  postgres_data:
  redis_data:
  blob_data:
