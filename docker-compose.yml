services:
  postgres:
    image: postgres:17
    container_name: local-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: appdb
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.2.5-bookworm
    container_name: local-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  sync-db:
    image: postgres:17
    environment:
      - SRC_URL=${NEON_URL}
      - DEST_URL=postgresql://postgres@postgres:5432/appdb
    entrypoint: >
      sh -c "apt-get update -qq && apt-get install -y -qq redis-tools && \
             redis-cli -h redis -p 6379 FLUSHALL && \
             pg_dump $$SRC_URL --format=custom --no-owner --no-privileges | \
             pg_restore -d $$DEST_URL --clean --if-exists --no-owner --no-privileges"
    depends_on:
      - postgres
      - redis

  blob:
    image: ghcr.io/payloadcms/vercel-blob-emulator:latest
    container_name: local-blob
    ports:
      - '3100:3000'
    environment:
      EMULATOR_BASE_URL: 'http://localhost:3100'
    volumes:
      - blob_data:/data

volumes:
  postgres_data:
  redis_data:
  blob_data:
