[package]
name = "ledger"
version = "0.1.0"
edition = "2021"
description = "Personal Finance Management System - Full-stack Rust with Leptos"
authors = ["Shreyansh Jain"]
license = "MIT"

[[bin]]
name = "ledger"
path = "src/main.rs"

[dependencies]
# Web Framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip"] }

# Async Runtime
tokio = { version = "1.44", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal", "migrate"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication
jsonwebtoken = "9.3"
bcrypt = "0.17"

# Utilities
uuid = { version = "1.16", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.37", features = ["serde", "db-postgres"] }
dotenvy = "0.15"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
cuid2 = "0.1"

# Cookie handling
tower-cookies = "0.11"
cookie = "0.18"

# Template rendering
askama = "0.13"
askama_axum = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
